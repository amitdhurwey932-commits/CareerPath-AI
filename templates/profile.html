{% extends 'base.html' %}
{% block title %}Edit Profile — CareerPath AI{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container" style="max-width:700px;">

    <div class="mb-4">
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
      </a>
    </div>

    <div class="text-center mb-4">
      <div class="avatar-circle mx-auto mb-3 d-flex align-items-center justify-content-center rounded-circle bg-primary text-white" style="width:72px;height:72px;font-size:2rem;">
        {{ user['username'][0]|upper }}
      </div>
      <h3 class="fw-bold">{{ user['username'] }}</h3>
      <p class="text-muted">{{ user['email'] }}</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4"><i class="bi bi-pencil-fill text-primary me-2"></i>Edit Your Profile</h5>

        <form method="POST" action="{{ url_for('profile') }}">

          <div class="mb-3">
            <label for="degree_course" class="form-label fw-semibold">Degree / Course</label>
            <input type="text" class="form-control" id="degree_course" name="degree_course"
                   placeholder="e.g. Bachelor of Computer Science"
                   value="{{ profile['degree_course'] if profile and profile['degree_course'] else '' }}">
          </div>

          <div class="mb-3">
            <label for="interests" class="form-label fw-semibold">Your Interests</label>
            <textarea class="form-control" id="interests" name="interests" rows="2"
                      placeholder="e.g. programming, artificial intelligence, data analysis, design">{{ profile['interests'] if profile and profile['interests'] else '' }}</textarea>
          </div>

          <div class="mb-3">
            <label for="technical_skills" class="form-label fw-semibold">Technical Skills</label>
            <textarea class="form-control" id="technical_skills" name="technical_skills" rows="2"
                      placeholder="e.g. Python, HTML, CSS, SQL, Excel">{{ profile['technical_skills'] if profile and profile['technical_skills'] else '' }}</textarea>
            <div class="form-text">Separate skills with commas.</div>
          </div>

          <div class="mb-3">
            <label for="soft_skills" class="form-label fw-semibold">Soft Skills</label>
            <input type="text" class="form-control" id="soft_skills" name="soft_skills"
                   placeholder="e.g. communication, teamwork, problem-solving"
                   value="{{ profile['soft_skills'] if profile and profile['soft_skills'] else '' }}">
          </div>

          <div class="mb-3">
            <label for="experience_level" class="form-label fw-semibold">Experience Level</label>
            <select class="form-select" id="experience_level" name="experience_level">
              <option value="beginner" {% if not profile or profile['experience_level'] == 'beginner' %}selected{% endif %}>Beginner (Student / No experience)</option>
              <option value="intermediate" {% if profile and profile['experience_level'] == 'intermediate' %}selected{% endif %}>Intermediate (Some projects/internships)</option>
              <option value="experienced" {% if profile and profile['experience_level'] == 'experienced' %}selected{% endif %}>Experienced (1–3 years)</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="preferred_field" class="form-label fw-semibold">Preferred Career Field</label>
            <select class="form-select" id="preferred_field" name="preferred_field">
              <option value="">Not sure / Open to all</option>
              <option value="technology" {% if profile and profile['preferred_field'] == 'technology' %}selected{% endif %}>Technology</option>
              <option value="data" {% if profile and profile['preferred_field'] == 'data' %}selected{% endif %}>Data & AI</option>
              <option value="design" {% if profile and profile['preferred_field'] == 'design' %}selected{% endif %}>Design</option>
              <option value="security" {% if profile and profile['preferred_field'] == 'security' %}selected{% endif %}>Security</option>
              <option value="marketing" {% if profile and profile['preferred_field'] == 'marketing' %}selected{% endif %}>Marketing</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="career_goals" class="form-label fw-semibold">Career Goals</label>
            <textarea class="form-control" id="career_goals" name="career_goals" rows="3"
                      placeholder="Describe what you want to achieve in your career...">{{ profile['career_goals'] if profile and profile['career_goals'] else '' }}</textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary fw-semibold px-4">
              <i class="bi bi-save me-2"></i>Save Profile
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>

  </div>
</section>
{% endblock %}
